name = "auto-apply-backend"
main = "src/worker.ts"
compatibility_date = "2026-04-06"

[vars]
API_VERSION = "v1"
AI_MODEL_ID = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

# Cloudflare Workers AI — truly intelligent, no API key needed
[ai]
binding = "AI"

[triggers]
crons = ["0 */4 * * *"]

# Async job queue — producer + consumer (Workers Free includes 10k ops/day)
[[queues.producers]]
queue = "apply-job-queue"
binding = "APPLY_QUEUE"

[[queues.consumers]]
queue = "apply-job-queue"
max_batch_size = 5
max_retries = 3
